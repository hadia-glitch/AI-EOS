name: eos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management and utilities
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  intl: ^0.19.0
  dio: ^5.7.0
  go_router: ^14.6.0
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.2
  flutter_dotenv: ^5.2.1

  # AI explanation and charting
  google_generative_ai: ^0.4.0
  fl_chart: ^0.68.0

  # Evidence screen — URL launching and markdown rendering
  url_launcher: ^6.3.0
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env